x-backend-environment: &backend-environment
  DATABASE_URL: postgresql://${DATABASE_USER:-itsm_user}:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}@db:5432/${DATABASE_NAME:-itsm_platform}
  DATABASE_USER: ${DATABASE_USER:-itsm_user}
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
  DEBUG: ${DEBUG:-false}
  ENVIRONMENT: ${ENVIRONMENT:-production}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/2

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: itsm_postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-itsm_platform}
      POSTGRES_USER: ${DATABASE_USER:-itsm_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-itsm_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itsm_network
    restart: unless-stopped

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    container_name: itsm_redis
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itsm_network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      <<: *backend-build
    container_name: itsm_backend
    environment: *backend-environment
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - itsm_network
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  # Celery Worker
  celery_worker:
    build:
      <<: *backend-build
    container_name: itsm_celery_worker
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - itsm_network
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 --queues=default,incidents,notifications,reports,sync

  # Celery Beat (Scheduler)
  celery_beat:
    build:
      <<: *backend-build
    container_name: itsm_celery_beat
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - itsm_network
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info

  # Flower (Celery Monitoring)
  flower:
    build:
      <<: *backend-build
    container_name: itsm_flower
    environment: *backend-environment
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    networks:
      - itsm_network
    restart: unless-stopped
    command: celery -A app.core.celery_app flower --port=5555

  test:
    build:
      <<: *backend-build
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - itsm_network
    profiles:
      - test
    command: ["pytest"]

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  itsm_network:
    driver: bridge
